spring.application.name=helloworld

spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=1.0.0
# SYNC: all @McpTool/@McpResource methods here are blocking (HttpClient, Thread.sleep, ProcessBuilder),
# not reactive. ASYNC annotation scanning requires Mono/Flux return types and silently skips
# imperative methods, which would otherwise register zero tools.
spring.ai.mcp.server.type=SYNC
# Streamable HTTP (single POST /mcp endpoint) - the SSE transport (/sse + /mcp/message) is
# deprecated since Spring AI 2.0 and still the effective default of the WebFlux starter.
spring.ai.mcp.server.protocol=STREAMABLE
# Sent to the client in the initialize handshake so the LLM knows how to use this server.
spring.ai.mcp.server.instructions=Read-only monitoring server for a single Linux host. \
Start with getSystemAnomalies for an overall health check (severity OK/WARNING/CRITICAL per metric), \
then drill down with the specific tools (memory, swap, CPU, load, disk space/activity, network, \
temperatures, PSI pressure). getCpuUsage, getDiskActivity, getPressureStats and getSystemAnomalies \
sample over 1 second. All host metrics come from a Prometheus node_exporter; if it is unreachable \
those tools return an error, while listJavaProcesses, greet and serverTime keep working. \
Static host info (hostname, kernel, OS, architecture) is available as the resource system://info.

server.port=8099

node-exporter.url=http://localhost:9100/metrics

health.threshold.cpu.warning=70
health.threshold.cpu.critical=90
health.threshold.memory.warning=80
health.threshold.memory.critical=90
health.threshold.swap.warning=70
health.threshold.swap.critical=90
health.threshold.disk.warning=80
health.threshold.disk.critical=90
# temperature thresholds as percentage of sensor's own critical value
health.threshold.temperature.warning=80
health.threshold.temperature.critical=95
# PSI thresholds in percent of time stalled/waiting per 1-second window
health.threshold.psi.cpu.some.warning=30
health.threshold.psi.cpu.some.critical=70
health.threshold.psi.io.full.warning=5
health.threshold.psi.io.full.critical=20
health.threshold.psi.memory.full.warning=1
health.threshold.psi.memory.full.critical=10
